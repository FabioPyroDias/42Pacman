[project]
name = "pacman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "mazegenerator"
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[tool.mypy]
exclude = ["pacman/", ".venv/"]

[[tool.mypy.overrides]]
module = "mazegenerator.*"
ignore_missing_imports = true